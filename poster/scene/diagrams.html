<!-- 2. Decision flow for one placement -->
<div class="fig" id="flow"><svg width="1900" height="760" viewBox="0 0 1900 760">
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B1F45"/></marker></defs>
<style>.t{font-size:27px;font-weight:bold;fill:#0B1F45}.s{font-size:21px;fill:#3B4A66}.w{fill:#fff}.y{font-size:21px;font-weight:bold;fill:#2E9D6B}.n{font-size:21px;font-weight:bold;fill:#E5486B}</style>
<rect x="20" y="300" width="250" height="140" rx="16" fill="#0B1F45"/><text x="145" y="358" text-anchor="middle" class="t w">Prompt played</text><text x="145" y="395" text-anchor="middle" class="s w">"Place the heart."</text>
<path d="M270,370 L330,370" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/>
<polygon points="470,270 610,370 470,470 330,370" fill="#fff" stroke="#2F6FDB" stroke-width="3"/><text x="470" y="360" text-anchor="middle" class="t" style="font-size:23px">All 4 markers</text><text x="470" y="392" text-anchor="middle" class="t" style="font-size:23px">visible?</text>
<polygon points="790,270 930,370 790,470 650,370" fill="#fff" stroke="#2F6FDB" stroke-width="3"/><text x="790" y="352" text-anchor="middle" class="t" style="font-size:23px">Board still</text><text x="790" y="384" text-anchor="middle" class="t" style="font-size:23px">for 1.5 s?</text>
<polygon points="1110,270 1250,370 1110,470 970,370" fill="#fff" stroke="#2F6FDB" stroke-width="3"/><text x="1110" y="352" text-anchor="middle" class="t" style="font-size:23px">AI sees a</text><text x="1110" y="384" text-anchor="middle" class="t" style="font-size:23px">hand?</text>
<polygon points="1440,270 1590,370 1440,470 1290,370" fill="#fff" stroke="#2F6FDB" stroke-width="3"/><text x="1440" y="360" text-anchor="middle" class="t" style="font-size:22px">AI ≥ 80% sure</text><text x="1440" y="390" text-anchor="middle" class="t" style="font-size:22px">either way?</text>
<path d="M610,370 L646,370" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="618" y="356" class="y">yes</text>
<path d="M930,370 L966,370" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="938" y="356" class="y">yes</text>
<path d="M1250,370 L1286,370" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="1256" y="356" class="n">no</text>
<path d="M1590,370 L1640,370" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="1596" y="356" class="y">yes</text>
<rect x="1645" y="250" width="235" height="240" rx="16" fill="#2E9D6B"/><text x="1762" y="320" text-anchor="middle" class="t w">Verdict</text><text x="1762" y="362" text-anchor="middle" class="s w">correct, or wrong:</text><text x="1762" y="392" text-anchor="middle" class="s w">wrong piece, wrong</text><text x="1762" y="422" text-anchor="middle" class="s w">zone, flipped, upside</text><text x="1762" y="452" text-anchor="middle" class="s w">down, left/right swap</text>
<!-- no branches -->
<path d="M470,270 L470,170" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="482" y="225" class="n">no</text>
<rect x="330" y="40" width="440" height="126" rx="16" fill="#FDE8ED" stroke="#E5486B" stroke-width="2"/><text x="550" y="92" text-anchor="middle" class="t" style="font-size:24px">Treated as a hand: wait</text><text x="550" y="130" text-anchor="middle" class="s">a covered marker is usually an arm</text>
<path d="M790,270 L790,170" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="802" y="225" class="n">no</text>
<rect x="800" y="40" width="380" height="126" rx="16" fill="#EEF2F8" stroke="#9AA3B5" stroke-width="2"/><text x="990" y="92" text-anchor="middle" class="t" style="font-size:24px">Keep watching</text><text x="990" y="130" text-anchor="middle" class="s">frames compared 4 times a second</text>
<path d="M1110,470 L1110,560" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="1122" y="520" class="y">yes</text>
<rect x="890" y="565" width="440" height="150" rx="16" fill="#FDE8ED" stroke="#E5486B" stroke-width="2"/><text x="1110" y="617" text-anchor="middle" class="t" style="font-size:24px">Not judged; after 5 s</text><text x="1110" y="655" text-anchor="middle" class="s">"Please move your hand away</text><text x="1110" y="685" text-anchor="middle" class="s">from the board."</text>
<path d="M1440,470 L1440,560" stroke="#0B1F45" stroke-width="4" marker-end="url(#f)"/><text x="1452" y="520" class="n">no</text>
<rect x="1360" y="565" width="520" height="150" rx="16" fill="#FFF6EA" stroke="#E7A24A" stroke-width="2"/><text x="1620" y="617" text-anchor="middle" class="t" style="font-size:24px">Operator decides</text><text x="1620" y="655" text-anchor="middle" class="s">"Is this piece placed correctly?"</text><text x="1620" y="685" text-anchor="middle" class="s">(3% of zones in session 5)</text>
<text x="20" y="560" class="s" style="font-size:20px">A piece partly outside its box is also not judged</text><text x="20" y="588" class="s" style="font-size:20px">until it settles. Each item has 30 s; a wrong first</text><text x="20" y="616" class="s" style="font-size:20px">try earns a hint and 20 more seconds.</text>
</svg></div>
