<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;font-family:'Liberation Serif','Times New Roman',serif}
  #wrap{position:relative;width:3000px;height:2000px}
  canvas{position:absolute;left:0;top:0}
  svg#leaders{position:absolute;left:0;top:0;pointer-events:none}
  .lab{position:absolute;width:500px;color:#14213D;font-size:40px;line-height:1.12}
  .lab b{display:block;font-size:44px;color:#0B1F45}
  .lab span{display:block;color:#3B4A66;font-size:34px;margin-top:4px}
  .lab .tag{display:inline-block;margin-top:8px;font-size:28px;padding:2px 14px;border-radius:20px;background:#FCE7C8;color:#8A4B00;border:2px solid #E7A24A}
  .num{position:absolute;width:56px;height:56px;border-radius:50%;background:#0B1F45;color:#fff;font-size:34px;font-weight:bold;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);font-family:'Liberation Sans',Arial,sans-serif}
</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body><div id="wrap"><svg id="leaders" width="3000" height="2000"></svg></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 3000, H = 2000;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('wrap').prepend(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const cam = new THREE.PerspectiveCamera(26, W / H, 1, 2000);
cam.position.set(205, 150, 300); cam.lookAt(-4, 30, 14);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c4d6, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-80, 160, 140); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 10, far: 500 });
scene.add(key);

const loader = new THREE.TextureLoader();
const tex = u => new Promise(r => loader.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));
const std = (o) => new THREE.MeshStandardMaterial(o);
const anchors = {};

/* ---------- desk ---------- */
const deskMat = std({ color: 0xE9DCC6, roughness: 0.7 });
const desk = new THREE.Mesh(new RoundedBoxGeometry(220, 4, 120, 4, 1.2), deskMat);
desk.position.set(0, -2, 20); desk.receiveShadow = true; desk.castShadow = true; scene.add(desk);
for (const [x, z] of [[-104, -34], [104, -34], [-104, 74], [104, 74]]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(4, 70, 4), std({ color: 0x8C96A8, roughness: 0.5, metalness: 0.4 }));
  leg.position.set(x, -39, z); leg.castShadow = true; scene.add(leg);
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -74; floor.receiveShadow = true; scene.add(floor);

/* ---------- board: plywood silhouette, front face textured with a real straightened photo ---------- */
const pts = [[-5.5,45.5],[-5.5,-1.5],[-4.6,-3.6],[-2.5,-4.5],[10.5,-4.5],[10.4,-8.6],[8.3,-10.6],[6.8,-12.2],[6.4,-13.8],[5.5,-15.2],[5.9,-16.4],[5.0,-18.6],[5.9,-20.2],[6.1,-23.8],[7.4,-27.3],[10.6,-29.6],[15.6,-30.2],[20.2,-28.8],[22.6,-26.0],[23.0,-20],[22.5,-12],[21.8,-4.5],[30.8,-4.5],[33.0,-3.6],[33.8,-1.5],[33.8,45.5]];
const CX = 14.15, BASE = 3;
const toW = (bx, by) => [bx - CX, 45.5 - by];
const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(...toW(x, y))));
const boardGeo = new THREE.ExtrudeGeometry(shape, { depth: 1.8, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.25, bevelSegments: 2, curveSegments: 24 });
// UVs from board cm -> straightened photo (view x -10..38.6, y -32..50)
const pos = boardGeo.attributes.position, uv = boardGeo.attributes.uv;
for (let i = 0; i < pos.count; i++) {
  const bx = pos.getX(i) + CX, by = 45.5 - pos.getY(i);
  uv.setXY(i, (bx + 10) / 48.6, 1 - (by + 32) / 82);
}
const boardTex = await tex('boardtex.jpg');
const frontMat = std({ map: boardTex, color: 0xC9C9C9, roughness: 0.6, metalness: 0.0 });
const sideMat = std({ color: 0xD9BE92, roughness: 0.8 });
const board = new THREE.Mesh(boardGeo, [frontMat, sideMat]);
board.castShadow = true; board.receiveShadow = true;
const boardGroup = new THREE.Group(); boardGroup.add(board);
board.position.z = -1.8;
boardGroup.position.set(-8, BASE, -22); boardGroup.rotation.x = -0.10; boardGroup.rotation.y = 0.12;
scene.add(boardGroup);
// stand
const stand = new THREE.Mesh(new RoundedBoxGeometry(46, 3, 16, 3, 0.8), std({ color: 0x5B6B86, roughness: 0.45, metalness: 0.3 }));
stand.position.set(-8, 1.5, -24); stand.rotation.y = 0.12; stand.castShadow = true; stand.receiveShadow = true; scene.add(stand);
const bw = (bx, by) => { const v = new THREE.Vector3(bx - CX, 45.5 - by, 0.3); return boardGroup.localToWorld(v); };
anchors.board = bw(-3.5, 30); anchors.markers = bw(0, 0); anchors.pieces = bw(19.5, 12);

/* ---------- tablet on its holder, camera facing the board ---------- */
const tablet = new THREE.Group();
const body = new THREE.Mesh(new RoundedBoxGeometry(27.0, 17.7, 0.75, 4, 0.9), std({ color: 0x3A3F4A, roughness: 0.35, metalness: 0.6 }));
body.castShadow = true; tablet.add(body);
const screenTex = await tex('screen.jpg');
const screen = new THREE.Mesh(new THREE.PlaneGeometry(25.4, 15.9), std({ map: screenTex, roughness: 0.25, emissive: 0xffffff, emissiveMap: screenTex, emissiveIntensity: 0.55 }));
screen.position.z = 0.39; tablet.add(screen);
const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.3, 24), std({ color: 0x111111, roughness: 0.2, metalness: 0.8 }));
lens.rotation.x = Math.PI / 2; lens.position.set(-11.5, 6.6, -0.45); tablet.add(lens);
tablet.position.set(10, 34, 52); tablet.rotation.y = 0.12 + 0.02; tablet.rotation.x = -0.06;
scene.add(tablet);
// holder: base, pole, clamp
const metal = std({ color: 0x9AA4B5, roughness: 0.35, metalness: 0.85 });
const base = new THREE.Mesh(new THREE.CylinderGeometry(9, 10, 1.6, 40), metal); base.position.set(10, 0.8, 54); base.castShadow = true; scene.add(base);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 25, 20), metal); pole.position.set(10, 13, 54.2); pole.castShadow = true; scene.add(pole);
const clamp = new THREE.Mesh(new RoundedBoxGeometry(10, 3, 3, 2, 0.6), metal); clamp.position.set(10, 25.8, 53.4); scene.add(clamp);
anchors.tablet = tablet.localToWorld(new THREE.Vector3(9, 4, 0.5));

/* ---------- student bust with the two breathing belts ---------- */
const skin = std({ color: 0xF1ECE6, roughness: 0.75 });
const bust = new THREE.Group();
const prof = [[0,0],[15,0],[16.5,2],[17,10],[16,20],[17.5,28],[19,33],[18,37],[12,40],[6.5,41.5],[5.2,44],[5.2,48],[0,48]].map(([x,y]) => new THREE.Vector2(x, y));
const torso = new THREE.Mesh(new THREE.LatheGeometry(prof, 64), skin); torso.scale.set(1, 1, 0.62); torso.castShadow = true; bust.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(8.6, 48, 32), skin); head.scale.set(0.92, 1.12, 1); head.position.y = 56; head.castShadow = true; bust.add(head);
const ped = new THREE.Mesh(new THREE.CylinderGeometry(7, 9, 4, 40), std({ color: 0x5B6B86, roughness: 0.45, metalness: 0.3 })); ped.position.y = -2; bust.add(ped);
const beltA = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 16, 96), std({ color: 0x1F8A8A, roughness: 0.5 }));
beltA.rotation.x = Math.PI / 2; beltA.scale.set(18.6, 11.8, 18); beltA.position.y = 30; bust.add(beltA);
const beltB = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 16, 96), std({ color: 0xE07A5F, roughness: 0.5 }));
beltB.rotation.x = Math.PI / 2; beltB.scale.set(17.2, 10.9, 18); beltB.position.y = 14; bust.add(beltB);
const potMat = std({ color: 0x20252E, roughness: 0.4, metalness: 0.3 });
const potA = new THREE.Mesh(new RoundedBoxGeometry(7, 2.2, 2, 2, 0.4), potMat); potA.position.set(0, 30, 11.8); bust.add(potA);
const potB = new THREE.Mesh(new RoundedBoxGeometry(7, 2.2, 2, 2, 0.4), potMat); potB.position.set(0, 14, 11.0); bust.add(potB);
bust.scale.setScalar(0.78); bust.position.set(70, 2, 22); bust.rotation.y = -0.65; scene.add(bust);
bust.updateMatrixWorld(true);
anchors.beltChest = bust.localToWorld(new THREE.Vector3(-16, 30, 5));
anchors.beltAbd = bust.localToWorld(new THREE.Vector3(-14.5, 14, 6));
const potAW = bust.localToWorld(new THREE.Vector3(0, 30, 13)), potBW = bust.localToWorld(new THREE.Vector3(0, 14, 12));

/* ---------- Pico W on a breadboard, MAX30102 clip ---------- */
const bb = new THREE.Mesh(new RoundedBoxGeometry(17, 1.0, 6, 2, 0.3), std({ color: 0xF4F4F0, roughness: 0.8 })); bb.position.set(46, 0.5, 70); bb.rotation.y = -0.3; bb.castShadow = true; bb.receiveShadow = true; scene.add(bb);
const pico = new THREE.Mesh(new RoundedBoxGeometry(10.2, 0.4, 4.2, 2, 0.15), std({ color: 0x1B7F3B, roughness: 0.5 })); pico.position.set(46, 1.7, 70); pico.rotation.y = -0.3; pico.castShadow = true; scene.add(pico);
const chip = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.35, 2.2), std({ color: 0x1E1E1E, roughness: 0.4 })); chip.position.set(46.5, 2.0, 70.2); chip.rotation.y = -0.3; scene.add(chip);
const shield = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 2.0), metal); shield.position.set(43.5, 2.0, 70.9); shield.rotation.y = -0.3; scene.add(shield);
const usb = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 1.2), metal); usb.position.set(51, 2.0, 68.4); usb.rotation.y = -0.3; scene.add(usb);
anchors.pico = new THREE.Vector3(46, 2.4, 70);
// MAX30102: purple module inside a finger clip
const clipBody = new THREE.Mesh(new RoundedBoxGeometry(5.2, 3.2, 3.4, 3, 0.9), std({ color: 0x2E3440, roughness: 0.45 })); clipBody.position.set(64, 1.8, 78); clipBody.rotation.y = 0.4; clipBody.castShadow = true; scene.add(clipBody);
const maxBoard = new THREE.Mesh(new RoundedBoxGeometry(2.6, 0.3, 2.6, 2, 0.15), std({ color: 0x6A2C91, roughness: 0.5 })); maxBoard.position.set(64, 3.55, 78); maxBoard.rotation.y = 0.4; scene.add(maxBoard);
anchors.max = new THREE.Vector3(64, 3.6, 78);

/* ---------- wires ---------- */
const wire = (pts, color) => { const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))); const m = new THREE.Mesh(new THREE.TubeGeometry(c, 80, 0.28, 8), std({ color, roughness: 0.5 })); m.castShadow = true; scene.add(m); };
wire([[potAW.x, potAW.y, potAW.z], [potAW.x - 4, potAW.y - 10, potAW.z + 10], [52, 6, 74], [48, 2.2, 71]], 0x1F8A8A);
wire([[potBW.x, potBW.y, potBW.z], [potBW.x - 3, potBW.y - 6, potBW.z + 8], [53, 3, 73], [48.5, 2.2, 70.6]], 0xE07A5F);
wire([[64, 2.2, 76.5], [58, 1.0, 76], [52, 1.0, 72], [49, 2.2, 70.4]], 0x6A2C91);

/* ---------- router and cloud ---------- */
const router = new THREE.Group();
const rb = new THREE.Mesh(new RoundedBoxGeometry(20, 3.4, 13, 3, 1.0), std({ color: 0x23272F, roughness: 0.35, metalness: 0.2 })); rb.position.y = 1.7; rb.castShadow = true; router.add(rb);
for (const x of [-7, 7]) { const a = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 15, 16), std({ color: 0x23272F, roughness: 0.4 })); a.position.set(x, 10, -5.5); a.rotation.z = x < 0 ? 0.18 : -0.18; a.castShadow = true; router.add(a); }
for (let i = 0; i < 4; i++) { const led = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 10), std({ color: 0x2BD576, emissive: 0x2BD576, emissiveIntensity: 1.5 })); led.position.set(-4.5 + i * 3, 2.4, 6.6); router.add(led); }
router.position.set(-66, 0, 52); router.rotation.y = 0.5; scene.add(router);
anchors.router = new THREE.Vector3(-66, 6, 52);

const cloud = new THREE.Group();
const cm = std({ color: 0xFFFFFF, roughness: 0.6, emissive: 0xDDE8FA, emissiveIntensity: 0.25 });
for (const [x, y, z, r] of [[0,0,0,11],[-11,-3,0,8],[11,-3,0,8.5],[-5,6,0,8],[6,5,-1,9],[18,-5,0,5.5],[-18,-5,0,5]]) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), cm); s.position.set(x, y, z); s.scale.z = 0.7; cloud.add(s); }
// a small results sheet in front of the cloud
const sheetC = document.createElement('canvas'); sheetC.width = 256; sheetC.height = 192; const g = sheetC.getContext('2d');
g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 192); g.fillStyle = '#1E8E4E'; g.fillRect(0, 0, 256, 34);
g.strokeStyle = '#9DB4A6'; g.lineWidth = 3; for (let y = 34; y < 192; y += 31) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); } for (let x = 0; x < 256; x += 64) { g.beginPath(); g.moveTo(x, 34); g.lineTo(x, 192); g.stroke(); }
const sheetT = new THREE.CanvasTexture(sheetC); sheetT.colorSpace = THREE.SRGBColorSpace;
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(13, 9.75), std({ map: sheetT, roughness: 0.6 })); sheet.position.set(0, -2, 8.5); cloud.add(sheet);
cloud.position.set(-62, 84, 6); cloud.rotation.y = 0.45; scene.add(cloud);
anchors.cloud = new THREE.Vector3(-58, 94, 6);

/* ---------- wireless links as dotted arcs ---------- */
const dots = (a, b, lift, color) => {
  const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += lift;
  const c = new THREE.QuadraticBezierCurve3(a, mid, b); const n = Math.round(a.distanceTo(b) / 3.2);
  const m = std({ color, emissive: color, emissiveIntensity: 0.6, roughness: 0.4 });
  for (let i = 1; i < n; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.75, 12, 12), m); s.position.copy(c.getPoint(i / n)); scene.add(s); }
};
dots(new THREE.Vector3(42, 8, 70), new THREE.Vector3(-58, 14, 54), 18, 0x2F6FDB);
dots(new THREE.Vector3(-2, 40, 52), new THREE.Vector3(-60, 18, 50), 10, 0x2F6FDB);
dots(new THREE.Vector3(-66, 24, 46), new THREE.Vector3(-62, 72, 8), 4, 0x2F6FDB);
// wifi rings above pico and router
const ring = (p, r) => { const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.35, 10, 48, Math.PI * 0.6), std({ color: 0x2F6FDB, emissive: 0x2F6FDB, emissiveIntensity: 0.6 })); t.position.copy(p); t.rotation.z = Math.PI * 0.2; scene.add(t); };
for (const r of [3, 5.5, 8]) { ring(new THREE.Vector3(46, 6, 70), r); ring(new THREE.Vector3(-66, 19, 46), r); }

renderer.render(scene, cam);

/* ---------- labels ---------- */
const P = v => { const p = v.clone().project(cam); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H]; };
const L = [
  ['board', 1, 'Plywood torso board', 'Upright; 28.6 × 39.5 cm between marker centres', null],
  ['markers', 2, 'Four ArUco markers', 'IDs 31, 115, 161, 261; the camera straightens the board from them', null],
  ['pieces', 3, 'Five magnetic organ pieces', 'Right lung, left lung, heart, windpipe, diaphragm; plus 5 decoy magnets', null],
  ['tablet', 4, 'Huawei MatePad 11.5 PaperMatte', 'Test app and camera AI (MobileNetV2), running offline', null],
  ['router', 5, 'Wi-Fi router', 'Links the Pico W and the tablet', 'p'],
  ['beltChest', 6, 'Chest belt', 'Linear potentiometer measures chest expansion', 'p'],
  ['beltAbd', 7, 'Abdomen belt', 'Linear potentiometer measures abdominal expansion', 'p'],
  ['max', 8, 'MAX30102 finger sensor', 'Heart rate during the breathing task', 'p'],
  ['pico', 9, 'Raspberry Pi Pico W', 'Reads the belts and the MAX30102; sends data over Wi-Fi', 'p'],
  ['cloud', 10, 'Cloud results sheet', 'Results kept offline on the tablet, then synced (Google Sheets)', 'p'],
];
const wrap = document.getElementById('wrap');
const badge = (x, y, n, planned, size) => { const d = document.createElement('div'); d.className = 'num'; d.textContent = n; Object.assign(d.style, { left: x + 'px', top: y + 'px', width: size + 'px', height: size + 'px', fontSize: (size * 0.55) + 'px', background: planned ? '#E7A24A' : '#0B1F45', boxShadow: '0 0 0 5px rgba(255,255,255,0.95)' }); wrap.appendChild(d); };
for (const [k, n, t, s, pl] of L) { const [ax, ay] = P(anchors[k]); badge(ax, ay, n, pl, 64); }
const col = (items, x) => { let y = 150; for (const [k, n, t, s, pl] of items) { const d = document.createElement('div'); d.className = 'lab'; d.style.left = (x + 70) + 'px'; d.style.top = y + 'px'; d.innerHTML = `<b>${t}</b><span>${s}</span>`; wrap.appendChild(d); badge(x + 28, y + 28, n, pl, 56); y += d.getBoundingClientRect().height + 54; } };
col(L.slice(0, 5), 40); col(L.slice(5), 2380);
const keyEl = document.createElement('div'); keyEl.className = 'lab'; Object.assign(keyEl.style, { left: '1000px', top: '1890px', width: '1100px', fontSize: '34px' });
keyEl.innerHTML = '<span style="display:inline-flex;align-items:center;gap:14px;margin-right:46px"><i style="display:inline-block;width:34px;height:34px;border-radius:50%;background:#0B1F45"></i> Built and tested</span><span style="display:inline-flex;align-items:center;gap:14px"><i style="display:inline-block;width:34px;height:34px;border-radius:50%;background:#E7A24A"></i> Designed, not yet tested</span>';
wrap.appendChild(keyEl);
window.DONE = true;
</script></body></html>
